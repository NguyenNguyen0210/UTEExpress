services:
  postgres:
    image: postgres:16-alpine
    container_name: uteexpress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uteexpress}
      POSTGRES_USER: ${POSTGRES_USER:-uteexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uteexpress123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uteexpress} -d ${POSTGRES_DB:-uteexpress}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
