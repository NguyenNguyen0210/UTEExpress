server:
  port: ${APP_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: UTEExpress
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:uteexpress}
    username: ${POSTGRES_USER:uteexpress}
    password: ${POSTGRES_PASSWORD:uteexpress123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    encoding: UTF-8
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Ho_Chi_Minh

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  pod-max-size-bytes: 5242880
  jwt:
    secret: ${JWT_SECRET:uteexpress-local-dev-jwt-secret-key-256bit-minimum-length-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: ACCESS_TOKEN
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:UTEEXP01}
    hash-secret: ${VNPAY_HASH_SECRET:UTEEXPRESSVNPAYSANDBOXSECRETKEY2026}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
  r2:
    endpoint: ${R2_ENDPOINT:https://00000000000000000000000000000000.r2.cloudflarestorage.com}
    access-key-id: ${R2_ACCESS_KEY_ID:local_dev_r2_access_key}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:local_dev_r2_secret_key}
    bucket-name: ${R2_BUCKET_NAME:uteexpress-pod}
