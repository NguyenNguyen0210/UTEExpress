<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base-portal}">
<head>
    <title>Đổi mật khẩu</title>
</head>
<body>
<h5 layout:fragment="page-title"><i class="bi bi-shield-lock me-2"></i>Đổi mật khẩu tài khoản</h5>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header py-3">
                    <i class="bi bi-key-fill text-warning me-2"></i>Cập nhật mật khẩu đăng nhập
                </div>
                <div class="card-body p-4">
                    <div class="bg-light border rounded-3 p-3 mb-4 small">
                        <div class="fw-bold text-primary" th:text="${accountUser.fullName}">Người dùng</div>
                        <div class="text-muted">
                            <span class="font-mono" th:text="${accountUser.email}">user@uteexpress.vn</span>
                            • <span class="badge bg-primary-subtle text-primary" th:text="${accountUser.role.label}">Vai trò</span>
                        </div>
                    </div>

                    <form th:action="@{/account/password}" method="post">
                        <div class="mb-3">
                            <label for="currentPassword" class="form-label fw-semibold">
                                Mật khẩu hiện tại <span class="text-danger">*</span>
                            </label>
                            <input type="password" id="currentPassword" name="currentPassword"
                                   class="form-control" required autocomplete="current-password">
                        </div>

                        <div class="mb-3">
                            <label for="newPassword" class="form-label fw-semibold">
                                Mật khẩu mới <span class="text-danger">*</span>
                            </label>
                            <input type="password" id="newPassword" name="newPassword"
                                   class="form-control" minlength="6" required autocomplete="new-password">
                            <div class="form-text">Tối thiểu 6 ký tự, nên kết hợp chữ hoa, chữ thường và số.</div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">
                                Xác nhận mật khẩu mới <span class="text-danger">*</span>
                            </label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="form-control" minlength="6" required autocomplete="new-password">
                        </div>

                        <button type="submit" class="btn btn-ute-orange w-100 py-2">
                            <i class="bi bi-check-circle-fill me-1"></i>Cập nhật mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
