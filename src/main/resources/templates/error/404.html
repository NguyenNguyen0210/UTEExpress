<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base-public}">
<head>
    <title>404 — Không tìm thấy trang</title>
</head>
<body>
<div layout:fragment="content" class="container py-5 text-center">
    <div class="card mx-auto p-5 shadow-sm" style="max-width: 540px;">
        <div class="text-warning mb-3"><i class="bi bi-compass-fill" style="font-size: 4rem;"></i></div>
        <h2 class="fw-bold text-primary">404 — Không tìm thấy dữ liệu</h2>
        <p class="text-muted mt-2" th:text="${errorMessage != null ? errorMessage : 'Trang hoặc vận đơn bạn yêu cầu không tồn tại trên hệ thống UTEExpress.'}">
            Trang bạn yêu cầu không tồn tại.
        </p>
        <div class="mt-4 d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-ute-navy"><i class="bi bi-house-door me-1"></i>Về trang chủ</a>
            <a th:href="@{/tracking}" class="btn btn-ute-orange"><i class="bi bi-search me-1"></i>Tra cứu vận đơn</a>
        </div>
    </div>
</div>
</body>
</html>
