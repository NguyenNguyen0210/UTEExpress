<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base-public}">
<head>
    <title>500 — Lỗi hệ thống</title>
</head>
<body>
<div layout:fragment="content" class="container py-5 text-center">
    <div class="card mx-auto p-5 shadow-sm" style="max-width: 540px;">
        <div class="text-danger mb-3"><i class="bi bi-exclamation-octagon-fill" style="font-size: 4rem;"></i></div>
        <h2 class="fw-bold text-danger">Đã xảy ra lỗi xử lý</h2>
        <p class="text-muted mt-2" th:text="${errorMessage != null ? errorMessage : 'Hệ thống gặp sự cố khi xử lý yêu cầu. Vui lòng kiểm tra lại dữ liệu và thử lại.'}">
            Hệ thống gặp sự cố khi xử lý yêu cầu.
        </p>
        <div class="mt-4 d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-ute-navy"><i class="bi bi-house-door me-1"></i>Về trang chủ</a>
        </div>
    </div>
</div>
</body>
</html>
